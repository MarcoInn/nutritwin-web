<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriTwin — Web MVP v1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>NutriTwin</h1>
        <p class="subtitle">Web MVP v1 · Executive Nutrition Snapshot</p>
      </div>
      <div class="top-actions">
        <button id="loadSampleBtn" class="btn btn-secondary">Load Sample Dataset</button>
      </div>
    </header>

    <main class="layout">
      <section class="card">
        <h2>User</h2>
        <div class="stack-sm">
          <label for="newUserName">Create test user</label>
          <div class="inline">
            <input id="newUserName" type="text" placeholder="e.g., Marco Test" />
            <button id="createUserBtn" class="btn">Create</button>
          </div>
        </div>

        <div class="stack-sm">
          <label for="userSelect">Select user</label>
          <select id="userSelect"></select>
        </div>

        <div class="stack-sm">
          <label for="reportDate">Report date</label>
          <input id="reportDate" type="date" />
        </div>
      </section>

      <section class="card">
        <h2>Add Meal Entry</h2>
        <form id="mealForm" class="grid-form">
          <label>
            Meal Name
            <input name="mealName" required type="text" placeholder="e.g., Lunch Bowl" />
          </label>

          <label>
            Meal Time
            <input name="mealDateTime" required type="datetime-local" />
          </label>

          <label class="full">
            Notes / Description
            <input name="description" type="text" placeholder="e.g., chicken, rice, avocado" />
          </label>

          <label>
            Calories (kcal)
            <input name="kcal" type="number" min="0" step="1" placeholder="optional" />
          </label>

          <label>
            Protein (g)
            <input name="protein" type="number" min="0" step="0.1" placeholder="optional" />
          </label>

          <label>
            Carbs (g)
            <input name="carbs" type="number" min="0" step="0.1" placeholder="optional" />
          </label>

          <label>
            Fat (g)
            <input name="fat" type="number" min="0" step="0.1" placeholder="optional" />
          </label>

          <label>
            Portionsfaktor
            <select id="portionFactor" name="portionFactor">
              <option value="0.75">Klein (0.75x)</option>
              <option value="1" selected>Normal (1.0x)</option>
              <option value="1.25">Groß (1.25x)</option>
              <option value="1.5">Sehr groß (1.5x)</option>
            </select>
          </label>

          <label class="full">
            Bild hochladen (optional)
            <input id="mealImageFile" name="mealImageFile" type="file" accept="image/*" />
          </label>

          <div id="imageTools" class="full image-tools hidden">
            <img id="mealImagePreview" alt="Meal Preview" />
            <div class="inline">
              <button id="analyzeImageBtn" type="button" class="btn btn-secondary">Foto analysieren</button>
              <span id="visionStatus" class="muted small">Noch nicht analysiert</span>
            </div>
            <div id="visionSuggestions" class="small muted"></div>
          </div>

          <label class="full">
            Image Path (reference)
            <input name="imagePath" type="text" placeholder="optional local/path/to/image.jpg" />
          </label>

          <div class="full inline">
            <button type="submit" class="btn">Save Meal</button>
            <button id="resetFormBtn" type="button" class="btn btn-secondary">Reset</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Daily Summary</h2>
        <div id="summary" class="summary-grid"></div>
      </section>

      <section class="card full-width">
        <div class="section-head">
          <h2>Daily Report</h2>
          <button id="exportMarkdownBtn" class="btn">Export Markdown</button>
        </div>

        <div id="reportView" class="report-view"></div>

        <label for="markdownOutput">Copy-ready Markdown</label>
        <textarea id="markdownOutput" rows="12" readonly placeholder="Generated report markdown appears here..."></textarea>
      </section>
    </main>
  </div>

  <template id="emptyStateTpl">
    <p class="muted">No entries for selected day yet.</p>
  </template>

  <script src="app.js"></script>
</body>
</html>
